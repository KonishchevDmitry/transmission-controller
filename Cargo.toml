[package]
name = "transmission-controller"
version = "0.2.0"
edition = "2024"
authors = ["Dmitry Konishchev <konishchev@gmail.com>"]

[profile.release]
codegen-units = 1
lto = true

[dependencies]
argparse = "0.2.2"
chan = "0.1.23"
chan-signal = "0.3.3"
email = "0.0.21"
enum_primitive = "0.1.1"
enum_primitive_serde_shim = "0.2"
itertools = "0.15.0"
lettre = "0.11.23"
lettre_email = "0.9.4"
libc = "0.2.191"
log = { version = "0.4.35", features = ["std"] }
mime = "0.3.18"
num = "0.4.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shellexpand = "3.1.2"
time = "0.3.55"
anyhow = "1.0.104"

# lettre dependency: force static linking
native-tls = { version = "0.2.18", features = ["vendored"] }
legacy_time = { package = "time", version = "0.1.42" }
